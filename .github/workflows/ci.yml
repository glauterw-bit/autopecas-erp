name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autopecas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Banco descartável do próprio job. Nenhum segredo real.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autopecas_ci
      DEVOLUCAO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autopecas_ci
      IMPLANTACAO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autopecas_ci
      MARKETPLACES_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autopecas_ci
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Extensões do Postgres (o bootstrap as cria em produção)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d autopecas_ci \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;' \
            -c 'CREATE EXTENSION IF NOT EXISTS unaccent;' \
            -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'

      - name: Aplicar migrações num banco vazio
        run: npx prisma migrate deploy

      - name: Schema e migrações devem estar iguais
        run: |
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
